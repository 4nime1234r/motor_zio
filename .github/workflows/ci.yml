name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar el SDK de Vulkan
        shell: pwsh
        run: choco install vulkan-sdk -y --no-progress

      - name: Configurar
        shell: pwsh
        run: cmake -S . -B build -A x64 -DZIO_EDITOR_UPDATER=ON -DZIO_BUILD_TESTS=ON

      - name: Compilar
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Pruebas
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure
