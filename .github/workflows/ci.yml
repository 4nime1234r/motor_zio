name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar el SDK de Vulkan
        shell: pwsh
        run: choco install vulkan-sdk -y --no-progress

      - name: Configurar
        shell: pwsh
        run: cmake -S . -B build -A x64 -DZIO_EDITOR_UPDATER=ON -DZIO_BUILD_TESTS=ON

      - name: Compilar
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Pruebas
        shell: pwsh
        run: ctest --test-dir build -C Release --output-on-failure

  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: sudo apt-get update && sudo apt-get install -y ninja-build g++ libvulkan-dev glslc pkg-config libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libwayland-dev wayland-protocols libxkbcommon-dev mesa-vulkan-drivers xvfb fontconfig fonts-dejavu-core

      - name: Configurar
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DZIO_BUILD_TESTS=ON

      - name: Compilar
        run: cmake --build build --parallel

      - name: Pruebas (con pantalla virtual y Vulkan por software)
        env:
          ZIO_REQUIRE_RENDER: '1'
          ZIO_REQUIRE_FONT: '1'
        run: xvfb-run -a ctest --test-dir build --output-on-failure
