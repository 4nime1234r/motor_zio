name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar el SDK de Vulkan
        shell: pwsh
        run: choco install vulkan-sdk -y --no-progress

      - name: Configurar
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Compilar
        shell: pwsh
        run: cmake --build build --config Release --parallel
