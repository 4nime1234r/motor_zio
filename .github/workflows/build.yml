name: Compilar y publicar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar el SDK de Vulkan
        shell: pwsh
        run: choco install vulkan-sdk -y --no-progress

      - name: Configurar
        shell: pwsh
        run: cmake -S . -B build -A x64

      - name: Compilar
        shell: pwsh
        run: cmake --build build --config Release --parallel

      - name: Empaquetar
        shell: pwsh
        run: |
          $nombre = "Zio-windows-x64"
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $nombre = "Zio-$($env:GITHUB_REF_NAME.TrimStart('v'))-windows-x64" }
          New-Item -ItemType Directory $nombre | Out-Null
          Copy-Item build/tools/zio_editor/Release/zio_editor.exe $nombre
          Copy-Item LICENSE, README.md $nombre
          Compress-Archive -Path "$nombre/*" -DestinationPath "$nombre.zip"
          "PAQUETE=$nombre.zip" | Out-File -Append -FilePath $env:GITHUB_ENV -Encoding utf8

      - uses: actions/upload-artifact@v4
        with:
          name: zio-windows-x64
          path: ${{ env.PAQUETE }}

      - name: Publicar la release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "Zio $($env:GITHUB_REF_NAME.TrimStart('v'))" --generate-notes
          }
          gh release upload $env:GITHUB_REF_NAME $env:PAQUETE --clobber
